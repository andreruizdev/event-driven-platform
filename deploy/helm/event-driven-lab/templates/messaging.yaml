# Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-zookeeper
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_4LW_COMMANDS_WHITELIST
          value: "ruok,stat,conf"
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-zookeeper
spec:
  selector:
    app: eventdrivenmicroservices-zookeeper
  ports:
  - port: 2181

---
# Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-kafka
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-kafka
    spec:
      initContainers:
      - name: wait-for-zookeeper
        image: confluentinc/cp-kafka:7.5.0
        command: ['cub', 'zk-ready', 'eventdrivenmicroservices-zookeeper:2181', '60']
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "eventdrivenmicroservices-zookeeper:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://eventdrivenmicroservices-kafka:9092,PLAINTEXT_HOST://localhost:29092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        ports:
        - containerPort: 9092

---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-kafka
spec:
  selector:
    app: eventdrivenmicroservices-kafka
  ports:
  - port: 9092

---
# Schema Registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-schema-registry
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-schema-registry
    spec:
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-schema-registry:7.5.0
        command: ['cub', 'kafka-ready', '-b', 'eventdrivenmicroservices-kafka:9092', '1', '60']
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:7.5.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: "eventdrivenmicroservices-schema-registry"
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: "eventdrivenmicroservices-kafka:9092"
        - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: SCHEMA_REGISTRY_LISTENERS
          value: "http://0.0.0.0:8081"
        ports:
        - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-schema-registry
spec:
  selector:
    app: eventdrivenmicroservices-schema-registry
  ports:
  - port: 8081

---
# Debezium Connect
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-debezium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-debezium
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-debezium
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: tmp-volume
        emptyDir: {}
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-kafka:7.5.0
        command: ['cub', 'kafka-ready', '-b', 'eventdrivenmicroservices-kafka:9092', '1', '60']
      containers:
      - name: debezium
        image: debezium/connect:2.5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        env:
        - name: BOOTSTRAP_SERVERS
          value: "eventdrivenmicroservices-kafka:9092"
        - name: GROUP_ID
          value: "1"
        - name: CONFIG_STORAGE_TOPIC
          value: "my_connect_configs"
        - name: OFFSET_STORAGE_TOPIC
          value: "my_connect_offsets"
        - name: STATUS_STORAGE_TOPIC
          value: "my_connect_statuses"
        - name: CONFIG_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: OFFSET_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: STATUS_STORAGE_REPLICATION_FACTOR
          value: "1"
        # Use standard Kafka JSON Converter
        - name: KEY_CONVERTER
          value: "org.apache.kafka.connect.json.JsonConverter"
        - name: VALUE_CONVERTER
          value: "org.apache.kafka.connect.json.JsonConverter"
        - name: CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE
          value: "false"
        - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
          value: "false"
        - name: CONNECT_CONFIG_PROVIDERS
          value: "env"
        - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
          value: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
        - name: DEBEZIUM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventdrivenmicroservices-secrets
              key: DEBEZIUM_PASSWORD
        ports:
        - containerPort: 8083
        readinessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-debezium
spec:
  selector:
    app: eventdrivenmicroservices-debezium
  ports:
  - port: 8083
    targetPort: 8083
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eventdrivenmicroservices-kafka-dlt-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-8"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: create-dead-letter-topic
        image: confluentinc/cp-kafka:7.5.0
        command: ["bash", "-ec"]
        args:
        - |
          cub kafka-ready -b eventdrivenmicroservices-kafka:9092 1 120
          kafka-topics --bootstrap-server eventdrivenmicroservices-kafka:9092 \
            --create --if-not-exists \
            --topic eventdrivenmicroservices-outbox-events.DLT \
            --partitions 1 --replication-factor 1 \
            --config cleanup.policy=delete --config retention.ms=604800000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eventdrivenmicroservices-debezium-connector-config
data:
  postgres-outbox-connector.json: |
    {
      "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
      "tasks.max": "1",
      "plugin.name": "pgoutput",
      "database.hostname": "eventdrivenmicroservices-postgres",
      "database.port": "5432",
      "database.user": "debezium_replication",
      "database.password": "${env:DEBEZIUM_PASSWORD}",
      "database.dbname": "eventdrivenmicroservices_db",
      "topic.prefix": "eventdrivenmicroservices_cdc",
      "table.include.list": "public.outbox_events",
      "column.include.list": "public.outbox_events.(id|aggregate_type|aggregate_id|event_type|payload|traceparent|created_at)",
      "publication.name": "eventdrivenmicroservices_outbox_publication",
      "publication.autocreate.mode": "disabled",
      "slot.name": "eventdrivenmicroservices_outbox_slot",
      "slot.drop.on.stop": "false",
      "snapshot.mode": "never",
      "topic.creation.default.replication.factor": "1",
      "topic.creation.default.partitions": "1",
      "topic.creation.default.cleanup.policy": "delete",
      "topic.creation.default.retention.ms": "86400000",
      "tombstones.on.delete": "false"
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eventdrivenmicroservices-debezium-register-connector
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: register-connector
        image: curlimages/curl:8.5.0
        command: ["sh", "-ec"]
        args:
        - |
          connect_url=http://eventdrivenmicroservices-debezium:8083
          connector_url="$connect_url/connectors/eventdrivenmicroservices-postgres-outbox-connector/config"
          until curl --fail --silent --show-error "$connect_url/" >/dev/null; do
            sleep 3
          done
          curl --fail --silent --show-error --request PUT \
            --header 'Content-Type: application/json' \
            --data-binary @/connector/postgres-outbox-connector.json \
            "$connector_url"
          while true; do
            status="$(curl --fail --silent --show-error "$connect_url/connectors/eventdrivenmicroservices-postgres-outbox-connector/status")"
            running_states="$(printf '%s' "$status" | grep -oE '"state"[[:space:]]*:[[:space:]]*"RUNNING"' | wc -l)"
            if [ "$running_states" -ge 2 ]; then
              break
            fi
            sleep 3
          done
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: connector-config
          mountPath: /connector
          readOnly: true
      volumes:
      - name: connector-config
        configMap:
          name: eventdrivenmicroservices-debezium-connector-config

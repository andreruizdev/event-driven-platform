# Zookeeper
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-zookeeper
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"
        - name: ZOOKEEPER_4LW_COMMANDS_WHITELIST
          value: "ruok,stat,conf"
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-zookeeper
spec:
  selector:
    app: eventdrivenmicroservices-zookeeper
  ports:
  - port: 2181

---
# Kafka
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-kafka
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-kafka
    spec:
      initContainers:
      - name: wait-for-zookeeper
        image: confluentinc/cp-kafka:7.5.0
        command: ['cub', 'zk-ready', 'eventdrivenmicroservices-zookeeper:2181', '60']
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "eventdrivenmicroservices-zookeeper:2181"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://eventdrivenmicroservices-kafka:9092,PLAINTEXT_HOST://localhost:29092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "0"
        ports:
        - containerPort: 9092

---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-kafka
spec:
  selector:
    app: eventdrivenmicroservices-kafka
  ports:
  - port: 9092

---
# Schema Registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-schema-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-schema-registry
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-schema-registry
    spec:
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-schema-registry:7.5.0
        command: ['cub', 'kafka-ready', '-b', 'eventdrivenmicroservices-kafka:9092', '1', '60']
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:7.5.0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: "eventdrivenmicroservices-schema-registry"
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: "eventdrivenmicroservices-kafka:9092"
        - name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: SCHEMA_REGISTRY_LISTENERS
          value: "http://0.0.0.0:8081"
        ports:
        - containerPort: 8081

---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-schema-registry
spec:
  selector:
    app: eventdrivenmicroservices-schema-registry
  ports:
  - port: 8081

---
# Debezium Connect
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-debezium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-debezium
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-debezium
    spec:
      initContainers:
      - name: wait-for-kafka
        image: confluentinc/cp-kafka:7.5.0
        command: ['cub', 'kafka-ready', '-b', 'eventdrivenmicroservices-kafka:9092', '1', '60']
      containers:
      - name: debezium
        image: debezium/connect:2.5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: BOOTSTRAP_SERVERS
          value: "eventdrivenmicroservices-kafka:9092"
        - name: GROUP_ID
          value: "1"
        - name: CONFIG_STORAGE_TOPIC
          value: "my_connect_configs"
        - name: OFFSET_STORAGE_TOPIC
          value: "my_connect_offsets"
        - name: STATUS_STORAGE_TOPIC
          value: "my_connect_statuses"
        - name: CONFIG_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: OFFSET_STORAGE_REPLICATION_FACTOR
          value: "1"
        - name: STATUS_STORAGE_REPLICATION_FACTOR
          value: "1"
        # Explicitly configure Avro Converter
        - name: KEY_CONVERTER
          value: "io.confluent.connect.avro.AvroConverter"
        - name: VALUE_CONVERTER
          value: "io.confluent.connect.avro.AvroConverter"
        - name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL
          value: "http://eventdrivenmicroservices-schema-registry:8081"
        - name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL
          value: "http://eventdrivenmicroservices-schema-registry:8081"
        ports:
        - containerPort: 8083

---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eventdrivenmicroservices-debezium-connector-config
data:
  postgres-outbox-connector.json: |
    {
      "name": "eventdrivenmicroservices-postgres-outbox-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "plugin.name": "pgoutput",
        "database.hostname": "eventdrivenmicroservices-postgres",
        "database.port": "5432",
        "database.user": "postgres",
        "database.password": "password",
        "database.dbname": "eventdrivenmicroservices_db",
        "database.server.name": "eventdrivenmicroservices_tx",
        "table.include.list": "public.outbox_events",
        "tombstones.on.delete": "false"
      }
    }

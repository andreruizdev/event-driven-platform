apiVersion: v1
kind: ConfigMap
metadata:
  name: eventdrivenmicroservices-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/outbox-alerts.yml

    scrape_configs:
      - job_name: 'platform-engine'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['platform-engine:8080']
  outbox-alerts.yml: |
    groups:
      - name: outbox-cdc
        rules:
          - alert: OutboxProgressStalled
            expr: eventdrivenmicroservices_outbox_oldest_pending_age_seconds > 60
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Oldest unprocessed outbox event is older than 60s (connector or bridge stalled)
          - alert: OutboxBacklogGrowing
            expr: eventdrivenmicroservices_outbox_pending > 100
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: More than 100 outbox events are pending
          - alert: OutboxPublishFailures
            expr: increase(eventdrivenmicroservices_outbox_processing_failure_total[5m]) > 0
            labels:
              severity: warning
            annotations:
              summary: Outbox publish or processed-state failures in the last 5 minutes
          - alert: ReplicationSlotInactive
            expr: eventdrivenmicroservices_replication_slot_inactive > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: A logical replication slot has no consumer; WAL is accumulating
          - alert: ReplicationSlotWalRetentionHigh
            expr: eventdrivenmicroservices_replication_slot_retained_bytes > 536870912
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: A replication slot retains more than 512 MiB of WAL
          - alert: ReplicationSlotMissing
            expr: eventdrivenmicroservices_replication_slot_count == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: No logical replication slot exists; CDC is not capturing changes
          - alert: DebeziumConnectorNotRunning
            expr: eventdrivenmicroservices_connector_running == 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: The Debezium connector is not RUNNING (failed, paused, missing or Connect unreachable)
          - alert: DebeziumTaskFailed
            expr: eventdrivenmicroservices_connector_tasks_failed > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: A Debezium connector task is FAILED; CDC is not capturing changes
          - alert: CdcConsumerLagHigh
            expr: max(kafka_consumer_fetch_manager_records_lag_max) > 1000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: A Kafka consumer in the platform is more than 1000 records behind

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-prometheus
  labels:
    app: eventdrivenmicroservices-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-prometheus
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
        - name: config-volume
          mountPath: /etc/prometheus/outbox-alerts.yml
          subPath: outbox-alerts.yml
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: config-volume
        configMap:
          name: eventdrivenmicroservices-prometheus-config
      - name: prometheus-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-prometheus
spec:
  selector:
    app: eventdrivenmicroservices-prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://eventdrivenmicroservices-prometheus:9090
        access: proxy
        isDefault: true
      - name: Tempo
        type: tempo
        url: http://eventdrivenmicroservices-tempo:3200
        access: proxy
      - name: Loki
        type: loki
        url: http://eventdrivenmicroservices-loki:3100
        access: proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Event-Driven-Lab'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-eventdrivenmicroservices
data:
  eventdrivenmicroservices.json: |
    {
      "title": "Event-Driven Microservices Lab Observability",
      "panels": [
        {
          "type": "timeseries",
          "title": "Anomaly Detection Rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            { "expr": "rate(eventdrivenmicroservices_anomalies_detected_total[1m])", "legendFormat": "Anomalies / sec" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Streaming Telemetry Z-Score",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            { "expr": "eventdrivenmicroservices_anomaly_latest_zscore", "legendFormat": "Latest Z-Score" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Ingestion Throughput",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count[1m])) by (uri, status)", "legendFormat": "{{"{{"}}uri{{"}}"}} ({{"{{"}}status{{"}}"}})" }
          ]
        },
        {
          "type": "stat",
          "title": "Pending outbox events",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 16},
          "targets": [
            { "expr": "eventdrivenmicroservices_outbox_pending", "legendFormat": "Pending" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Oldest pending event age",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 16},
          "targets": [
            { "expr": "eventdrivenmicroservices_outbox_oldest_pending_age_seconds", "legendFormat": "Age (seconds)" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Outbox delivery outcomes",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 16},
          "targets": [
            { "expr": "rate(eventdrivenmicroservices_outbox_publish_success_total[5m])", "legendFormat": "Published / sec" },
            { "expr": "rate(eventdrivenmicroservices_outbox_processing_failure_total[5m])", "legendFormat": "Failures / sec" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Outbox retries",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 22},
          "targets": [
            { "expr": "rate(eventdrivenmicroservices_outbox_retry_total[5m])", "legendFormat": "Retries / sec" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Outbox publish acknowledgement p95",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 22},
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(eventdrivenmicroservices_outbox_publish_duration_seconds_bucket[5m])) by (le))", "legendFormat": "p95 seconds" }
          ]
        },
        {
          "type": "stat",
          "title": "Debezium connector and task state",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 28},
          "targets": [
            { "expr": "eventdrivenmicroservices_connector_running", "legendFormat": "Connector running" },
            { "expr": "eventdrivenmicroservices_connector_tasks_running", "legendFormat": "Running tasks" }
          ]
        },
        {
          "type": "stat",
          "title": "Debezium failed tasks",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 28},
          "targets": [
            { "expr": "eventdrivenmicroservices_connector_tasks_failed", "legendFormat": "Failed tasks" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Kafka consumer lag (records)",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 28},
          "targets": [
            { "expr": "max(kafka_consumer_fetch_manager_records_lag_max)", "legendFormat": "Max records behind" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Logical replication slot retained WAL",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 34},
          "targets": [
            { "expr": "eventdrivenmicroservices_replication_slot_retained_bytes", "legendFormat": "Retained bytes" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Replication slot health",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 34},
          "targets": [
            { "expr": "eventdrivenmicroservices_replication_slot_inactive", "legendFormat": "Inactive slots" },
            { "expr": "eventdrivenmicroservices_replication_slot_count", "legendFormat": "Total slots" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-grafana
  labels:
    app: eventdrivenmicroservices-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-grafana
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:13.2.3
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventdrivenmicroservices-secrets
              key: GF_SECURITY_ADMIN_PASSWORD
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: "true"
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-dashboard-eventdrivenmicroservices
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-tmp
          mountPath: /tmp
      volumes:
      - name: grafana-data
        emptyDir: {}
      - name: grafana-tmp
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      - name: grafana-dashboard-eventdrivenmicroservices
        configMap:
          name: grafana-dashboard-eventdrivenmicroservices
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-grafana
spec:
  selector:
    app: eventdrivenmicroservices-grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eventdrivenmicroservices-otel-collector-config
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      debug:
        verbosity: detailed
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "event_driven_lab"
      otlp/tempo:
        endpoint: "eventdrivenmicroservices-tempo:4317"
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-otel-collector
  labels:
    app: eventdrivenmicroservices-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-otel-collector
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.162.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args: ["--config=/etc/otel-collector-config.yaml"]
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 8889
        volumeMounts:
        - name: config-volume
          mountPath: /etc/otel-collector-config.yaml
          subPath: otel-collector-config.yaml
      volumes:
      - name: config-volume
        configMap:
          name: eventdrivenmicroservices-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-otel-collector
spec:
  selector:
    app: eventdrivenmicroservices-otel-collector
  ports:
    - name: grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: http
      protocol: TCP
      port: 4318
      targetPort: 4318
    - name: metrics
      protocol: TCP
      port: 8889
      targetPort: 8889
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/traces
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-tempo
  labels:
    app: eventdrivenmicroservices-tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-tempo
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:3.0.0
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        args: ["-config.file=/etc/tempo.yaml"]
        ports:
        - containerPort: 3200
        - containerPort: 4317
        volumeMounts:
        - name: tempo-config-vol
          mountPath: /etc/tempo.yaml
          subPath: tempo.yaml
        - name: tempo-data
          mountPath: /var/tempo
        - name: tempo-tmp
          mountPath: /tmp
      volumes:
      - name: tempo-data
        emptyDir: {}
      - name: tempo-tmp
        emptyDir: {}
      - name: tempo-config-vol
        configMap:
          name: tempo-config
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-tempo
spec:
  selector:
    app: eventdrivenmicroservices-tempo
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: tempo-http
      protocol: TCP
      port: 3200
      targetPort: 3200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-loki
  labels:
    app: eventdrivenmicroservices-loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-loki
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.7.8
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: loki-data
          mountPath: /loki
        - name: loki-tmp
          mountPath: /tmp
      volumes:
      - name: loki-data
        emptyDir: {}
      - name: loki-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-loki
spec:
  selector:
    app: eventdrivenmicroservices-loki
  ports:
    - protocol: TCP
      port: 3100
      targetPort: 3100

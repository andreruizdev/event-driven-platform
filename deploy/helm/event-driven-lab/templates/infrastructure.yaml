apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-postgres
  labels:
    app: eventdrivenmicroservices-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-postgres
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventdrivenmicroservices-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: eventdrivenmicroservices_db
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-postgres
spec:
  selector:
    app: eventdrivenmicroservices-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-redis
  labels:
    app: eventdrivenmicroservices-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-redis
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-redis
spec:
  selector:
    app: eventdrivenmicroservices-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-postgres
  labels:
    app: eventdrivenmicroservices-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eventdrivenmicroservices-postgres
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        args: ["postgres", "-c", "wal_level=logical"]
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventdrivenmicroservices-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: eventdrivenmicroservices_db
        {{- if .Values.postgres.persistence.enabled }}
        # A subdirectory avoids initdb failing on the volume's lost+found directory.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        {{- end }}
        ports:
        - containerPort: 5432
        {{- if .Values.postgres.persistence.enabled }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        {{- end }}
      {{- if .Values.postgres.persistence.enabled }}
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: eventdrivenmicroservices-postgres-data
      {{- end }}
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eventdrivenmicroservices-postgres-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-postgres
spec:
  selector:
    app: eventdrivenmicroservices-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eventdrivenmicroservices-postgres-cdc-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: configure-cdc
        image: postgres:15-alpine
        command: ["sh", "-ec"]
        args:
        - |
          until PGPASSWORD="$POSTGRES_PASSWORD" psql -h eventdrivenmicroservices-postgres -U postgres -d eventdrivenmicroservices_db -c 'SELECT 1' >/dev/null 2>&1; do
            sleep 3
          done
          until PGPASSWORD="$POSTGRES_PASSWORD" psql -h eventdrivenmicroservices-postgres -U postgres -d eventdrivenmicroservices_db -tAc "SELECT to_regclass('public.outbox_events') IS NOT NULL" | grep -q t; do
            sleep 3
          done
          PGPASSWORD="$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 -v debezium_password="$DEBEZIUM_PASSWORD" -h eventdrivenmicroservices-postgres -U postgres -d eventdrivenmicroservices_db <<'SQL'
          SELECT format('CREATE ROLE debezium_replication WITH LOGIN REPLICATION PASSWORD %L', :'debezium_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'debezium_replication')
          \gexec
          ALTER ROLE debezium_replication WITH LOGIN REPLICATION PASSWORD :'debezium_password';
          GRANT SELECT ON TABLE public.outbox_events TO debezium_replication;
          SELECT 'CREATE PUBLICATION eventdrivenmicroservices_outbox_publication FOR TABLE public.outbox_events WITH (publish = ''insert'')'
          WHERE NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'eventdrivenmicroservices_outbox_publication')
          \gexec
          ALTER PUBLICATION eventdrivenmicroservices_outbox_publication SET TABLE public.outbox_events;
          ALTER PUBLICATION eventdrivenmicroservices_outbox_publication SET (publish = 'insert');
          SQL
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventdrivenmicroservices-secrets
              key: POSTGRES_PASSWORD
        - name: DEBEZIUM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: eventdrivenmicroservices-secrets
              key: DEBEZIUM_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventdrivenmicroservices-redis
  labels:
    app: eventdrivenmicroservices-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventdrivenmicroservices-redis
  template:
    metadata:
      labels:
        app: eventdrivenmicroservices-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: eventdrivenmicroservices-redis
spec:
  selector:
    app: eventdrivenmicroservices-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

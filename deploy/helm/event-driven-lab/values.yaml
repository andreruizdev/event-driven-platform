# Default values for Event-Driven Microservices Lab.

global:
  env: "dev"

platformEngine:
  replicaCount: 1
  image:
    repository: event-driven-lab/platform-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

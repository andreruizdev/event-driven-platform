name: Event-Driven Lab CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    name: Package & Dependency Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Enforce No Hardcoded Secrets
        run: |
          if grep -r "eventdrivenmicroservices_default_secret_key_change_in_prod" ./apps; then
            echo "Hardcoded secrets found! Build failed."
            exit 1
          else
            echo "No hardcoded secrets found."
          fi

      - name: OWASP Dependency Check (Java)
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: 'Event-Driven Microservices Lab'
          path: './apps/platform-engine'
          format: 'HTML'

  test:
    name: Build & Test Java Ingestion API
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          
      - name: Build and Test Platform Engine (Java)
        working-directory: ./apps/platform-engine
        run: ./gradlew build

  integration-test:
    name: Local Integration Test (Kind)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.8.0

      - name: Build Docker Image
        run: |
          docker build -t platform-engine:local ./apps/platform-engine

      - name: Load Image into Kind
        run: |
          kind load docker-image platform-engine:local

      - name: Deploy Helm Chart
        run: |
          kubectl create namespace event-driven-lab --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic eventdrivenmicroservices-secrets \
            --from-literal=POSTGRES_PASSWORD=test \
            --from-literal=JWT_SECRET_KEY=test-secret-for-ci-only \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD=test \
            --namespace event-driven-lab \
            --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install event-driven-lab ./deploy/helm/event-driven-lab \
            --namespace event-driven-lab \
            --set platformEngine.image.pullPolicy=Never \
            --set platformEngine.image.tag=local \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get pods -A
          kubectl wait --for=condition=ready pod --all --timeout=300s

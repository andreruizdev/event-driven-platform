name: Event-Driven Lab CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    name: Package & Dependency Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Enforce No Hardcoded Secrets
        run: |
          if grep -r "eventdrivenmicroservices_default_secret_key_change_in_prod" ./apps; then
            echo "Hardcoded secrets found! Build failed."
            exit 1
          else
            echo "No hardcoded secrets found."
          fi

      - name: OWASP Dependency Check (Java)
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: 'Event-Driven Microservices Lab'
          path: './apps/platform-engine'
          format: 'HTML'

  test:
    name: Build & Test Java Ingestion API
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eventdrivenmicroservices
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eventdrivenmicroservices"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/eventdrivenmicroservices
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
      SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/eventdrivenmicroservices
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      SPRING_SECURITY_USER_PASSWORD: ci-test-password
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          
      - name: Build and Test Platform Engine (Java)
        working-directory: ./apps/platform-engine
        run: ./gradlew build

      - name: Require PostgreSQL integration tests to run
        working-directory: ./apps/platform-engine
        run: |
          for report in \
            build/test-results/test/TEST-com.eventdrivenmicroservices.platform.IntegrationTests.xml \
            build/test-results/test/TEST-com.eventdrivenmicroservices.platform.E2EOutboxIntegrationTest.xml; do
            if [ ! -f "$report" ]; then
              echo "Missing integration test report: $report"
              exit 1
            fi
            if grep -q '<skipped' "$report"; then
              echo "Integration test was skipped: $report"
              exit 1
            fi
          done

  integration-test:
    name: Local Integration Test (Kind)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@dda0770415bac9fc20092cacbc54aa298604d140 # v1.8.0
        with:
          cluster_name: eventdrivenmicroservices-cluster

      - name: Build Docker Image
        run: |
          docker build -t platform-engine:local ./apps/platform-engine

      - name: Load Image into Kind
        run: |
          kind load docker-image platform-engine:local --name eventdrivenmicroservices-cluster

      - name: Deploy Helm Chart
        run: |
          kubectl create namespace event-driven-lab --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic eventdrivenmicroservices-secrets \
            --from-literal=POSTGRES_PASSWORD=test \
            --from-literal=DEBEZIUM_PASSWORD=test-debezium \
            --from-literal=JWT_SECRET_KEY=test-secret-for-ci-only \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD=test \
            --from-literal=ADMIN_PASSWORD=ci-admin-password \
            --namespace event-driven-lab \
            --dry-run=client -o yaml | kubectl apply -f -

          helm upgrade --install event-driven-lab ./deploy/helm/event-driven-lab \
            --namespace event-driven-lab \
            --set platformEngine.image.repository=platform-engine \
            --set platformEngine.image.pullPolicy=Never \
            --set platformEngine.image.tag=local \
            --wait --timeout=300s

      - name: Verify Deployment
        run: |
          kubectl get pods -n event-driven-lab
          kubectl wait --for=condition=ready pod --all --namespace event-driven-lab --timeout=300s
          kubectl rollout status deployment/platform-engine --namespace event-driven-lab --timeout=300s

      - name: Run PostgreSQL durability drill
        run: ./scripts/postgres-durability-drill.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,pvc -n event-driven-lab
          kubectl logs -n event-driven-lab deploy/eventdrivenmicroservices-postgres --tail=100 || true

  cdc-drill:
    name: Debezium CDC Drill (Kind)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@dda0770415bac9fc20092cacbc54aa298604d140 # v1.8.0
        with:
          cluster_name: eventdrivenmicroservices-cluster

      - name: Build and Load Image
        run: |
          docker build -t platform-engine:local ./apps/platform-engine
          kind load docker-image platform-engine:local --name eventdrivenmicroservices-cluster

      - name: Deploy Helm Chart (default CDC mode)
        run: |
          kubectl create namespace event-driven-lab --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic eventdrivenmicroservices-secrets \
            --from-literal=POSTGRES_PASSWORD=test \
            --from-literal=DEBEZIUM_PASSWORD=test-debezium \
            --from-literal=JWT_SECRET_KEY=test-secret-for-ci-only \
            --from-literal=GF_SECURITY_ADMIN_PASSWORD=test \
            --from-literal=ADMIN_PASSWORD=ci-admin-password \
            --namespace event-driven-lab \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install event-driven-lab ./deploy/helm/event-driven-lab \
            --namespace event-driven-lab \
            --set platformEngine.image.repository=platform-engine \
            --set platformEngine.image.pullPolicy=Never \
            --set platformEngine.image.tag=local \
            --wait --timeout=300s
          kubectl rollout status deployment/platform-engine --namespace event-driven-lab --timeout=300s

      - name: Run CDC restart drill
        run: ./scripts/cdc-drill.sh

      - name: Run load and reconciliation test
        env:
          LOAD_TOTAL: "400"
          LOAD_CONCURRENCY: "20"
          LOAD_P95_BUDGET_MS: "2000"
        run: ./scripts/load-test.sh

      - name: Run assertion-based demo
        run: |
          kubectl -n event-driven-lab port-forward deploy/platform-engine 18082:8080 >/dev/null 2>&1 &
          PF=$!
          trap 'kill $PF' EXIT
          sleep 5
          BASE_URL=http://localhost:18082 \
          ADMIN_PASSWORD=ci-admin-password ./scripts/demo.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n event-driven-lab
          kubectl logs -n event-driven-lab deploy/platform-engine --tail=200 || true
          kubectl logs -n event-driven-lab deploy/eventdrivenmicroservices-debezium --tail=200 || true
